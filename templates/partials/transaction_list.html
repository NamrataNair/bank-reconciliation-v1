<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Date</th>
            <th>Bank/Source</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for tx in transactions %}
        <tr>
            <td>{{ tx.date }}</td>
            <td>{{ tx.bank_account.bank.name }}</td>
            <td>{{ tx.description }}</td>
            <td>{{ tx.amount }}</td>
            <td>{{ tx.status }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5" class="text-center">No transactions found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
