version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bank_reconciliation
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: gunicorn bank_reconciliation.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=development_secret_key_change_in_prod
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=bank_reconciliation
      - SQL_USER=bank_user
      - SQL_PASSWORD=bank_password
      - SQL_HOST=db
      - SQL_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434/api/generate
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    command: celery -A bank_reconciliation worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=development_secret_key_change_in_prod
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=bank_reconciliation
      - SQL_USER=bank_user
      - SQL_PASSWORD=bank_password
      - SQL_HOST=db
      - SQL_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434/api/generate
    depends_on:
      - db
      - redis
      - web

volumes:
  postgres_data:
